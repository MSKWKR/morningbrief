name: Build and publish Docker image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: go vet ./...
      - run: go test ./...

      - uses: docker/setup-buildx-action@v4

      # Build locally first so Trivy can scan before anything is pushed.
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: morningbrief:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Always produce a human-readable report, pass or fail, before the gate below can stop the job.
      - name: Generate vulnerability report (HTML)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: morningbrief:scan
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-report.html

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.html

      - name: Fail build on HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: morningbrief:scan
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/morningbrief:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/morningbrief:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
